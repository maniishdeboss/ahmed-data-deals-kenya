# Development environment for the Base44 sandbox / preview.
# Runs the static site through Vite (port 3000) and the Vercel-style
# serverless handlers in ./api through a small Express host (port 8000).
services:
  api:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    env_file:
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - PORT=8000
    volumes:
      - .:/app
      - /app/node_modules
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --no-package-lock && exec npx tsx watch server/dev-api.ts
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/callback',{method:'OPTIONS'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - API_PROXY_TARGET=http://api:8000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --no-package-lock && exec npx vite --host 0.0.0.0 --port 3000 --strictPort
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
